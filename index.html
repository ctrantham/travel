<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad's Orlando Birthday Escape</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bebas+Neue&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --ink:#241C38;
    --ink-soft:#5B5270;
    --paper:#FBF7FF;
    --paper-raised:#FFFFFF;
    --line:#E4DAF5;
    --disney:#7C4FE0;
    --disney-deep:#5A32B8;
    --gold:#B9820A;
    --gold-bright:#E8A400;
    --universal:#E14A26;
    --universal-deep:#B93A1C;
    --teal:#0E7C77;
    --shadow: 0 12px 28px -16px rgba(36,28,56,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1ECFF;
      --ink-soft:#C3B8DE;
      --paper:#150E23;
      --paper-raised:#1E1530;
      --line:#392A54;
      --disney:#A67BFF;
      --disney-deep:#C7A9FF;
      --gold:#FFC94A;
      --gold-bright:#FFC94A;
      --universal:#FF7A54;
      --universal-deep:#FFA184;
      --teal:#3FD6CF;
      --shadow: 0 12px 32px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1ECFF;
    --ink-soft:#C3B8DE;
    --paper:#150E23;
    --paper-raised:#1E1530;
    --line:#392A54;
    --disney:#A67BFF;
    --disney-deep:#C7A9FF;
    --gold:#FFC94A;
    --gold-bright:#FFC94A;
    --universal:#FF7A54;
    --universal-deep:#FFA184;
    --teal:#3FD6CF;
    --shadow: 0 12px 32px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito Sans', system-ui, -apple-system, sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  a{color:inherit;}
  .note a, .wish-item p a{color:var(--gold); text-decoration:underline; font-weight:700;}
  .wrap{max-width:920px; margin:0 auto; padding:0 24px;}
  @media (max-width:600px){ .wrap{padding:0 16px;} }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:76px 0 56px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 700px 380px at 18% -10%, color-mix(in srgb, var(--disney) 20%, transparent), transparent 65%),
      radial-gradient(ellipse 700px 380px at 88% -5%, color-mix(in srgb, var(--universal) 20%, transparent), transparent 65%);
  }
  .burst{position:absolute; pointer-events:none;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .eyebrow::before{
    content:"";
    width:26px; height:1px;
    background:var(--ink-soft);
    opacity:.5;
  }
  .hero h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(2.3rem, 5.5vw, 3.6rem);
    line-height:1.04;
    background:linear-gradient(100deg, var(--disney-deep) 12%, var(--gold-bright) 46%, var(--universal-deep) 82%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero .sub{
    margin-top:18px;
    font-size:1.1rem;
    color:var(--ink-soft);
    max-width:56ch;
  }
  .hero .sub strong{color:var(--ink); font-weight:800;}
  .badges{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-top:28px;
  }
  .badge{
    font-family:'JetBrains Mono', monospace;
    font-size:.78rem;
    padding:7px 13px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--paper-raised);
    display:flex; align-items:center; gap:7px;
  }
  .badge .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .badge.dis .dot{background:var(--disney);}
  .badge.uni .dot{background:var(--universal);}

  /* ---------- SECTION HEADERS ---------- */
  section{padding:44px 0;}
  .section-head{margin-bottom:28px;}
  .section-head .kicker{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:6px;
    display:block;
  }
  .section-head h2{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.7rem;
  }
  .section-head p{color:var(--ink-soft); margin-top:8px; max-width:60ch;}

  /* ---------- HOME BASE CARDS ---------- */
  .homebase{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:680px){ .homebase{grid-template-columns:1fr;} }
  .hb-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:24px 24px 22px;
    box-shadow:var(--shadow);
    border-top:4px solid var(--accent, var(--disney));
  }
  .hb-card.uni{--accent:var(--universal);}
  .hb-card .hb-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent, var(--disney));
    font-weight:700;
  }
  .hb-card h3{
    font-family:'Fredoka', sans-serif;
    font-size:1.3rem;
    font-weight:600;
    margin-top:6px;
  }
  .hb-card .hb-dates{
    font-family:'JetBrains Mono', monospace;
    font-size:.88rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .hb-list{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:9px;}
  .hb-list li{display:flex; justify-content:space-between; gap:14px; font-size:.92rem; border-top:1px solid var(--line); padding-top:9px;}
  .hb-list li:first-child{border-top:none; padding-top:0;}
  .hb-list .k{color:var(--ink-soft);}
  .hb-list .v{text-align:right; font-weight:700;}

  /* ---------- TODO CHECKLIST ---------- */
  .todo-section{padding-top:52px; padding-bottom:8px;}
  .todo-list{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px 24px;
    box-shadow:var(--shadow);
    display:grid; gap:14px;
  }
  .todo-hint{margin:6px 2px 14px; color:var(--ink-soft); font-size:.9rem; font-style:italic;}
  .todo-item{
    display:flex; align-items:flex-start; gap:13px; font-size:.98rem;
    cursor:pointer; padding:6px 8px; margin:-6px -8px; border-radius:10px;
    transition:background .15s ease, transform .12s ease; user-select:none;
    order:1;
  }
  .todo-item.done{order:2;}
  .todo-item:hover{background:color-mix(in srgb, var(--gold) 9%, transparent);}
  .todo-item:active{transform:scale(.99);}
  .todo-item:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .todo-box{
    width:19px; height:19px; border:2px solid var(--gold);
    border-radius:6px; flex:none; margin-top:2px;
  }
  .todo-item strong{font-weight:700;}
  .todo-item span.sub{display:block; color:var(--ink-soft); font-size:.85rem; margin-top:2px;}
  .todo-item.done .todo-box{background:var(--teal); border-color:var(--teal); position:relative;}
  .todo-item.done .todo-box::after{
    content:"\2713"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--paper-raised); font-size:.7rem; font-weight:700;
  }
  .todo-item.done strong{color:var(--ink-soft); text-decoration:line-through;}

  /* ---------- GLANCE CALENDAR ---------- */
  .glance-section{padding-top:52px; padding-bottom:8px;}
  .glance{display:grid; grid-template-columns:repeat(7,1fr); gap:9px;}
  @media (max-width:860px){ .glance{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:560px){ .glance{grid-template-columns:repeat(2,1fr);} }
  .glance-day{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:13px;
    padding:11px 10px 12px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:7px;
  }
  .glance-day.flag{border:1px dashed var(--gold); background:color-mix(in srgb, var(--gold) 8%, var(--paper-raised));}
  html{ scroll-behavior:smooth; }
  a.glance-day{ text-decoration:none; color:inherit; cursor:pointer; transition:box-shadow .12s ease, transform .12s ease; }
  a.glance-day:hover{ box-shadow:0 10px 22px -8px rgba(36,28,56,.38); transform:translateY(-2px); }
  a.glance-day:active{ transform:translateY(0); }
  .day[id]{ scroll-margin-top:16px; }
  section[id], header[id]{ scroll-margin-top:16px; }

  /* ---------- SECTION / DAY JUMP NAV ---------- */
  .navjump{
    display:flex; flex-wrap:wrap; gap:9px; justify-content:center;
    margin:26px 0; position:relative; z-index:1;
  }
  .navjump a{
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    text-decoration:none; color:var(--disney);
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:100px; padding:7px 15px;
    transition:background .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .navjump a:hover{
    background:color-mix(in srgb, var(--disney) 10%, var(--paper-raised));
    transform:translateY(-1px); box-shadow:var(--shadow);
  }
  .navjump a:active{ transform:translateY(0); }
  .navjump.in-timeline{ margin:18px 0 18px; }
  @media print{ .navjump{ display:none; } }
  .gd-date{
    font-family:'JetBrains Mono', monospace;
    font-size:.62rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:700;
  }
  .gd-date strong{display:block; font-family:'Fredoka',sans-serif; font-size:1rem; color:var(--ink); letter-spacing:0; margin-top:1px; font-weight:600;}
  .gd-row{display:flex; align-items:flex-start; gap:6px; font-size:.74rem; line-height:1.28;}
  .gd-dots{display:flex; gap:2px; flex:none; margin-top:4px;}
  .gd-dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .gd-dot.dis{background:var(--disney);}
  .gd-dot.uni{background:var(--universal);}
  .gd-tix{
    margin-top:auto; padding-top:7px; border-top:1px dashed var(--line);
    font-family:'JetBrains Mono', monospace; font-size:.63rem; color:var(--ink-soft);
  }
  .gd-hrs{
    font-family:'JetBrains Mono', monospace; font-size:.66rem;
    color:var(--ink-soft); white-space:nowrap;
  }
  .gd-wx{
    font-family:'JetBrains Mono', monospace; font-size:.63rem;
    color:var(--teal); white-space:nowrap; margin-top:-2px;
  }
  .gd-flag{
    font-size:.63rem; color:var(--gold); font-weight:700;
    display:flex; align-items:center; gap:4px; margin-top:-1px;
  }
  .gd-fw{
    font-family:'JetBrains Mono', monospace;
    font-size:.63rem; font-weight:700; line-height:1.25;
    color:var(--disney); display:flex; align-items:flex-start; gap:5px;
    margin-top:6px; padding-top:6px; border-top:1px dotted var(--line);
  }
  .gd-fw.uni-fw{ color:var(--universal); }
  .gd-fw .fw-ic{ flex:none; }
  .glance-legend{
    display:flex; flex-wrap:wrap; gap:16px;
    margin-top:14px; font-size:.78rem; color:var(--ink-soft);
    align-items:center;
  }
  .glance-legend span{display:flex; align-items:center; gap:6px;}
  .glance-legend .gd-dot{width:8px; height:8px;}

  /* ---------- CROWD GRID ---------- */
  .crowd-grid-wrap{overflow-x:auto; padding-bottom:4px;}
  table.crowd-grid{
    width:100%; min-width:760px;
    border-collapse:separate; border-spacing:5px 5px;
  }
  table.crowd-grid thead th{
    font-family:'JetBrains Mono', monospace;
    font-size:.64rem; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:700;
    text-align:center; padding-bottom:2px;
  }
  table.crowd-grid tbody th{
    text-align:left;
    font-family:'Nunito Sans', sans-serif; font-weight:700; font-size:.82rem;
    color:var(--ink); white-space:nowrap; padding-right:12px;
  }
  table.crowd-grid tr.grp td{
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft);
    padding:14px 0 5px;
    border-bottom:1px solid var(--line);
  }
  table.crowd-grid td.cell{
    text-align:center;
    border-radius:9px;
    padding:7px 4px 8px;
    font-family:'JetBrains Mono', monospace;
    min-width:60px;
  }
  .cell-num{font-weight:700; font-size:.88rem; line-height:1.15;}
  .cell-hrs{font-weight:600; font-size:.6rem; line-height:1.2; opacity:.8; margin-top:2px; white-space:nowrap;}
  .cell.c1,.cell.c2{background:color-mix(in srgb, var(--teal) 10%, transparent); color:var(--teal);}
  .cell.c3,.cell.c4{background:color-mix(in srgb, var(--teal) 24%, transparent); color:var(--teal);}
  .cell.c5,.cell.c6{background:color-mix(in srgb, var(--teal) 40%, transparent); color:var(--teal);}
  .cell.c7,.cell.c8{background:color-mix(in srgb, var(--teal) 58%, transparent); color:var(--teal);}
  .cell.c9,.cell.c10{background:var(--teal); color:var(--paper-raised);}
  .cell.chosen{box-shadow:0 0 0 2px var(--gold) inset;}
  .crowd-legend{
    display:flex; flex-wrap:wrap; align-items:center; gap:18px;
    margin-top:16px; font-size:.78rem; color:var(--ink-soft);
  }
  .crowd-ramp{display:flex; align-items:center; gap:5px;}
  .crowd-ramp .sw{width:20px; height:14px; border-radius:4px;}
  .crowd-ramp .sw.r1{background:color-mix(in srgb, var(--teal) 10%, transparent);}
  .crowd-ramp .sw.r2{background:color-mix(in srgb, var(--teal) 24%, transparent);}
  .crowd-ramp .sw.r3{background:color-mix(in srgb, var(--teal) 40%, transparent);}
  .crowd-ramp .sw.r4{background:color-mix(in srgb, var(--teal) 58%, transparent);}
  .crowd-ramp .sw.r5{background:var(--teal);}
  .crowd-legend .ring{width:16px; height:16px; border-radius:5px; box-shadow:0 0 0 2px var(--gold) inset; flex:none;}

  /* ---------- TIMELINE ---------- */
  .timeline{position:relative;}
  .spine{
    position:absolute; left:26px; top:6px; bottom:6px; width:2px;
    background:linear-gradient(var(--disney), var(--disney) 52%, var(--universal) 52%, var(--universal));
    opacity:.35;
  }
  @media (max-width:680px){ .spine{left:18px;} }
  .day{
    position:relative;
    padding-left:64px;
    margin-bottom:22px;
  }
  @media (max-width:680px){ .day{padding-left:46px;} }
  .day .node{
    position:absolute; left:16px; top:6px;
    width:22px; height:22px; border-radius:50%;
    background:var(--paper-raised);
    border:3px solid var(--accent, var(--disney));
  }
  @media (max-width:680px){ .day .node{left:8px; width:18px; height:18px;} }
  .day.uni .node{--accent:var(--universal);}
  .day-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    box-shadow:var(--shadow);
  }
  .day-top{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-bottom:8px;
  }
  .day-date{
    font-family:'JetBrains Mono', monospace;
    font-size:.78rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent, var(--disney));
    font-weight:700;
  }
  .day.uni .day-date{--accent:var(--universal);}
  .day-title{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.22rem;
  }
  .day.uni .day-title{font-family:'Bebas Neue', 'Fredoka', sans-serif; letter-spacing:.02em; font-size:1.4rem;}
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:.66rem; letter-spacing:.06em; text-transform:uppercase;
    padding:3px 9px; border-radius:100px; font-weight:700;
    white-space:nowrap;
  }
  .tag.confirmed{background:color-mix(in srgb, var(--teal) 18%, transparent); color:var(--teal);}
  .tag.suggested{background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold);}
  .tag.crowd{background:color-mix(in srgb, var(--ink-soft) 18%, transparent); color:var(--ink-soft);}
  .tag.pending{background:transparent; color:var(--gold); border:1px dashed var(--gold);}
  .day-body p{margin:8px 0 0; color:var(--ink-soft); font-size:.95rem;}
  .day-body .note{
    margin-top:12px;
    padding:10px 13px;
    background:color-mix(in srgb, var(--gold) 10%, transparent);
    border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0;
    font-size:.87rem;
    color:var(--ink);
  }

  /* portal divider */
  .portal{
    position:relative;
    margin:38px 0 30px 0;
    padding-left:64px;
  }
  @media (max-width:680px){ .portal{padding-left:46px;} }
  .portal-inner{
    display:flex; align-items:center; gap:16px;
    background:var(--paper-raised);
    border:1px dashed var(--line);
    border-radius:100px;
    padding:12px 22px;
  }
  .portal-inner svg{flex:none;}
  .portal-text{
    font-family:'JetBrains Mono', monospace;
    font-size:.78rem;
    letter-spacing:.05em;
    color:var(--ink-soft);
  }
  .portal-text strong{color:var(--ink); font-weight:700;}

  /* ---------- HOUR BY HOUR ---------- */
  .hr-list{display:flex; flex-direction:column;}
  .hr-block{
    display:grid; grid-template-columns:82px 1fr; gap:12px;
    padding:8px 0; border-bottom:1px dashed var(--line);
    font-size:.88rem;
  }
  .hr-block:last-child{border-bottom:none;}
  .hr-time{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:.8rem;
    color:var(--accent, var(--disney));
  }
  .day.uni .hr-time{--accent:var(--universal);}
  .hr-desc{color:var(--ink);}
  .hr-desc .sub{display:block; color:var(--ink-soft); font-size:.82rem; margin-top:2px;}
  .hr-block.open{
    background:color-mix(in srgb, var(--gold) 8%, transparent);
    border-radius:8px; padding:8px 10px; margin:2px 0;
    border-bottom:none;
  }
  .hr-block.open .hr-time{color:var(--gold);}
  .hr-open-tag{
    font-family:'JetBrains Mono', monospace; font-size:.64rem; font-weight:700;
    text-transform:uppercase; letter-spacing:.05em; color:var(--gold);
    margin-left:8px;
  }
  .hr-tp{
    display:inline-block; font-family:'JetBrains Mono', monospace;
    font-size:.86rem; font-weight:700; color:var(--teal);
    background:color-mix(in srgb, var(--teal) 16%, transparent);
    border-radius:100px; padding:1px 9px; margin-left:8px; white-space:nowrap; vertical-align:middle;
  }

  /* ---------- TICKET STUBS ---------- */
  .stubs{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:680px){ .stubs{grid-template-columns:1fr;} }
  .stub{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;
  }
  .stub .side{
    width:10px; flex:none;
    background:repeating-linear-gradient(180deg, var(--accent, var(--disney)) 0 8px, transparent 8px 15px);
  }
  .stub.uni .side{--accent:var(--universal);}
  .stub-main{padding:18px 20px; flex:1; min-width:0;}
  .stub-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .stub-name{font-family:'Fredoka', sans-serif; font-weight:600; font-size:1.02rem;}
  .stub.uni .stub-name{font-family:'Bebas Neue','Fredoka',sans-serif; letter-spacing:.02em; font-size:1.15rem;}
  .stub-conf{
    font-family:'JetBrains Mono', monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .stub-meta{list-style:none; margin:12px 0 0; padding:0; display:grid; gap:6px;}
  .stub-meta li{display:flex; justify-content:space-between; font-size:.85rem; gap:10px;}
  .stub-meta .k{color:var(--ink-soft);}
  .stub-meta .v{font-weight:700; text-align:right;}
  .stub-cost{
    margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono', monospace;
  }
  .stub-cost .amt{font-weight:700; font-size:1.05rem;}

  /* ---------- HEADS UP ---------- */
  .headsup{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:18px;
    padding:26px 26px 8px;
    box-shadow:var(--shadow);
  }
  .hu-item{
    display:grid; grid-template-columns:28px 1fr; gap:14px;
    padding-bottom:20px; margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
